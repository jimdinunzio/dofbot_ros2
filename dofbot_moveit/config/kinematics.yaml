# Measured on this robot with /compute_ik, 120 exactly-reachable pose goals
# (generated by running random valid joint states through /compute_fk):
#
#   timeout 0.005 (as shipped)   116/120 solved
#   timeout 0.05  (as set below) 118/120
#   timeout 0.5                  119/120
#   orientation off the 5-DOF manifold by 10 deg     0/120
#
# So KDL solves this arm perfectly well. What it cannot do is invent an
# orientation: the arm is 5-DOF, the reachable poses form a manifold, and a goal
# off that manifold has no solution to find. Every failure above is that, not a
# solver weakness -- and 0.005 s was already good for 97%.
#
# Raised to 0.05 anyway: it buys the last couple of percent for free, and RViz's
# interactive marker is the main user of this plugin.
#
# dofbot_ctrl does not depend on this solver, for a different reason. Its API is
# (x, y, z, phi, roll) -- five numbers for five joints -- so a caller never has
# to already know an achievable quaternion in order to ask for a pose. See
# dofbot_kinematics.py.
arm_group:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
